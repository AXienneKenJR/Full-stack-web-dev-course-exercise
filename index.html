<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Form</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="page-bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
  </div>

  <main class="login-wrapper">
    <div class="login-card">

      <h2 class="card-title">Log in with</h2>

  
      <div class="social-row">
        <button class="social-btn">
          <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        
        </button>

        <button class="social-btn">
        
          <svg width="18" height="18" viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-37.5-167.2-117.8c-71.5-91.2-130.5-239.3-130.5-380.2 0-222.6 145.3-340.1 287.9-340.1 76.9 0 141 51.2 189.5 51.2 46.3 0 119.7-54.3 202.1-54.3zm-167.3-235.1c39.5-47.2 67.1-112.6 67.1-177.9 0-8.9-.6-17.9-2.2-25.5-63.9 2.4-139.2 42.6-183.7 95.5-36 40.2-68.8 105.4-68.8 171.6 0 9.6 1.6 19.2 2.2 22.2 4.1.6 10.8 1.6 17.5 1.6 57.5 0 126.7-38.5 167.9-87.5z"/>
          </svg>
          Apple
        </button>
      </div>

      <div class="divider"><span>or</span></div>

   
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email address" />
      </div>

      
      <div class="field-group">
        <div class="field-header">
          <label for="password">Password</label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>
        <input type="password" id="password" placeholder="Enter your password" />
      </div>

      
      <button class="login-btn">LOG IN</button>

      <p class="signup-text">Don't have an account? <a href="#">Sign up</a></p>

    </div>
  </main>

</body>
</html>
